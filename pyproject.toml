[build-system]
requires = [
    "setuptools>=83.0.0",
    "wheel>=0.47.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "decider-lay"
version = "0.13.2"
description = ""
requires-python = ">=3.12"
authors = [
    { name = "Helmut Konrad Schewe", email = "helmutus@outlook.com" },
]
dependencies = [
    "configos>=1.0.4,<2.0.0",
    "groupmes>=1.1.2,<2.0.0",
    "iamraw>=4.95.1,<5.0.0",
    "protoerror>=3.20.4,<4.0.0",
    "texes>=1.0.1,<2.0.0",
    "utilo>=2.112.1,<3.0.0",
    "verbo>=1.23.4,<2.0.0",
]
keywords = []
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
license = "MIT"
license-files = [
    "LICENSE",
]

[project.readme]
file = "README"
content-type = "text/markdown"

[project.optional-dependencies]
dev = [
    "gennex==1.1.0",
    "genref==1.4.4",
    "hoverpower==1.7.0",
    "utilotest==1.1.1",
    "writers>=1.7.1,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/anaticulae/decider-lay"
Repository = "https://github.com/anaticulae/decider-lay"

[project.scripts]
decider_border = "decider_border.cli:main"
decider_textstyle = "decider_textstyle.cli:main"

[tool.semantic_release]
version_toml = [
    "pyproject.toml:project.version",
]

[tool.semantic_release.changelog]
mode = "init"
output_format = "md"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG"

[tool.semantic_release.commit_parser_options]
patch_tags = [
    "build",
    "chore",
    "ci",
    "deps",
    "docs",
    "fix",
    "perf",
    "refactor",
    "style",
    "test",
]
minor_tags = [
    "feat",
]

[tool.setuptools.packages.find]
where = [
    ".",
]
include = [
    "decider_border",
    "decider_border.detection",
    "decider_border.features",
    "decider_lay",
    "decider_textstyle",
    "decider_textstyle.features",
    "decider_textstyle.headlines",
    "decider_textstyle.text",
    "decider_textstyle.toc",
]
exclude = [
    "tests*",
]

[tool.hoverpower]
packages = [
    "BACHELOR",
    "BOOK",
    "DISS",
    "DOCU",
    "HOME",
    "MASTER",
    "TECH",
]
